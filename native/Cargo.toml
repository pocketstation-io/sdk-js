[package]
name = "pocketstation-js"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native PocketStation runtime bindings for the JavaScript SDK"
license = "MIT"
repository = "https://github.com/pocketstation-io/sdk-js"

[lib]
crate-type = ["cdylib"]

[features]
default = []
conformance-fixtures = ["pocketstation/conformance-fixtures"]

[dependencies]
napi = { version = "3.12.2", features = ["napi8", "tokio_rt"] }
napi-derive = "3.6.3"
pocketstation = "=1.1.10"
pocketstation-relay = "=0.1.5"
futures = "0.3.31"
futures-timer = "3.0.3"

[build-dependencies]
napi-build = "2.4.1"

# On macOS 27, Rust 1.95's optimized cdylib without line tables can produce
# an unaligned LINKEDIT string pool that dyld refuses to load. The optimized
# build with line tables loads; keep this profile until the toolchain fix lands.
[profile.release]
debug = 1

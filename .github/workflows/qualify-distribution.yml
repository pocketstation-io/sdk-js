name: javascript-wss-diagnostic-only

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: javascript-wss-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/diagnostic/wss-win32-node20-174'
    name: Diagnostic win32-x64-msvc Node 20 (not distribution qualification)
    runs-on: windows-2025
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
          architecture: x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.8'
          architecture: x64
      - name: Test raw ZIP refusal and Windows descendant cleanup
        env:
          PKS_WINDOWS_OWNER_TEST_OUTPUT: diagnostic-ownership
        run: python -B -m unittest discover -s tests -p test_native_matrix.py -k DiagnosticOverlayTests
      - name: Diagnose the original binary with a distinct retained harness
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_HARNESS_SHA: ${{ github.sha }}
        run: >-
          python -B tools/qualify-native-matrix.py diagnose-windows
          --harness-commit "$env:DIAGNOSTIC_HARNESS_SHA" --output diagnostic-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-only-win32-x64-msvc-node20
          path: |
            diagnostic-ownership/*.json
            diagnostic-output/diagnostic-terminal.json
            diagnostic-output/cell-receipts/*.json
            diagnostic-output/installed-consumer/receipt.json
            diagnostic-output/installed-consumer/stdout.raw
            diagnostic-output/installed-consumer/stderr.raw
          if-no-files-found: error

name: javascript-sdk-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Check out JavaScript SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt, llvm-tools

      - name: Install Python for native build tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Install Linux audio development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libpipewire-0.3-dev clang pkg-config

      - name: Install exact JavaScript dependencies
        run: npm ci

      - name: Verify Cargo dependency lock
        run: cargo check --manifest-path native/Cargo.toml --locked

      - name: Verify bundled AEC notices
        run: npm run notices:check

      - name: Type-check and test package
        run: npm test

      - name: Verify public package exports
        run: npm run test:exports

      - name: Install and run the packed package
        run: npm run test:packed

      - name: Check native formatting, lint, and tests
        if: matrix.node == 20
        run: npm run native:check

      - name: Check the public Node API report
        if: runner.os == 'Linux' && matrix.node == 20
        run: npm run api:check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  aec:
    name: opt-in AEC / macOS
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt, llvm-tools
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build and test explicitly enabled artifact
        env:
          PKS_EXPECT_AEC: '1'
        run: |
          python -m pip install 'meson==1.7.2' 'ninja==1.11.1.4'
          npm ci
          npm run build:native:aec
          npm run build:typescript
          node tools/test-packed-consumer.mjs
          node --experimental-vm-modules node_modules/.bin/jest src/__tests__/node-aec.test.ts --runInBand
          cargo test --manifest-path native/Cargo.toml --all-features --locked
          cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features --locked -- -D warnings
